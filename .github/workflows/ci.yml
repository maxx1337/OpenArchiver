name: CI

# JR-1-05. This workflow is **check-only**: it never writes a file back into the repository.
# No `pnpm format`, no auto-fix, no commit, no push. Reason (ADR-015): `docs/api/openapi.json`
# and `packages/backend/src/database/migrations/meta/` are generated and both generators write
# them back with `JSON.stringify(..., null, 2)`, so they live in `.prettierignore`. A formatting
# CI step would fight the generators on every run, forever.

on:
    pull_request:
    push:

# Read-only token. The check-only rule above is thereby enforced by the token scope, not just by
# the absence of a writing step.
permissions:
    contents: read

jobs:
    verify:
        name: Lint, build, typecheck, test
        runs-on: ubuntu-latest

        # `packages/backend/src/database/index.ts` builds its `db` singleton **at import time** and
        # throws without `DATABASE_URL`. The `integration` suite therefore needs a real Postgres;
        # without one it would skip *visibly*, which is still green and exactly the false comfort we
        # do not want in CI -- hence `OA_TEST_REQUIRE_INFRA` below, which turns that skip into a
        # failure. Mirrors docker-compose.yml.
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: postgres
                ports:
                    - 5432:5432
                # The `postgres` superuser has CREATEDB plus DDL in the databases it creates, which
                # is what `acquireTestDatabase()` needs (Testplan section 2.6). One database is
                # enough: `postgres` serves only as the maintenance DB, the harness creates and
                # drops its own `oa_test_*` databases per run. Default `max_connections` (100) is
                # sufficient.
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

            # JR-6-01. The `journal-inbound` worker is a BullMQ consumer, and proving that the process
            # starts means starting it -- which needs a broker. Until E6 every suite got by with
            # Postgres alone, which is why this service is new here.
            #
            # `OA_TEST_REQUIRE_INFRA: '1'` below is what makes it mandatory rather than nice to have: a
            # `suiteRequiring(probeRedis())` suite would *fail* this job if nothing were listening,
            # instead of skipping quietly. Adding the service and setting the variable are therefore one
            # change, not two.
            #
            # Same image as docker-compose.yml, but **without** its `--requirepass`, and that difference
            # is a limitation rather than a simplification. A GitHub Actions service container takes
            # `image`, `env`, `ports`, `volumes` and `options` (docker *create* flags) -- there is no way
            # to append a server argument, and `valkey-server --requirepass …` is exactly that. So this
            # broker is password-less and `REDIS_PASSWORD` stays unset in this job's env.
            #
            # What that costs: the AUTH path is not exercised here. It is exercised locally, where
            # docker-compose.yml does set `--requirepass` -- and `probeRedis()` is deliberately a plain
            # TCP connect so a wrong password arrives as a connection error rather than as a skip. If the
            # AUTH path ever needs to be covered in CI, the way to do it is a `docker run` step instead of
            # a service container, not a change to the code under test.
            valkey:
                image: valkey/valkey:8-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "valkey-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

            # JR-6-02b / ADR-035. The Phase-B end-to-end test needs a real search index to prove
            # "spool file to searchable hit" as an assertion, not a manual, once-off demonstration.
            #
            # Unlike `valkey` above, `MEILI_MASTER_KEY` is a documented environment variable
            # (`https://www.meilisearch.com/docs/learn/security/basic_security`), not a CLI flag --
            # measured directly against this image rather than assumed, because the `valkey` service's
            # own limitation is exactly the mistake "surely env works the same way here" would repeat.
            # A container started the same way this service starts (`docker run -e MEILI_MASTER_KEY=... -p
            # 7700:7700 getmeili/meilisearch:v1.38`, no `command`) answers `/health` without a key,
            # `/indexes` with `401` without one, `403` with a wrong one, and `200` with the right one --
            # so authentication is fully exercised here, with no equivalent to the `valkey` gap.
            meilisearch:
                image: getmeili/meilisearch:v1.38
                env:
                    MEILI_MASTER_KEY: ci-test-only-meili-master-key-not-a-secret
                    MEILI_ENV: development
                    MEILI_NO_ANALYTICS: 'true'
                ports:
                    - 7700:7700
                # `curl` is present in this image (measured: `docker run --rm getmeili/meilisearch:v1.38
                # which curl`) -- the image ships no Docker `HEALTHCHECK` of its own, so without this
                # GitHub Actions would consider the container "started" as soon as the process forks,
                # not once its HTTP server actually accepts connections.
                options: >-
                    --health-cmd "curl -f http://localhost:7700/health"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            # Server *and* credentials for the test harness.
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
            PGPASSWORD: postgres
            # JR-6-01: the same variables `packages/backend/src/config/redis.ts` reads, so the spawned
            # `journal-inbound` worker and `probeRedis()` in the harness point at the service container
            # above. `REDIS_PASSWORD` is deliberately absent -- see the note on that service.
            REDIS_HOST: localhost
            REDIS_PORT: '6379'
            # JR-1-05b. This job *provisions* Postgres, so a suite skipping because Postgres is
            # unreachable is a broken job, not a legitimate skip. With this set, `suiteRequiring()`
            # emits a failing test instead of a visible skip. Positive expectation, in the suite --
            # it replaces the log grep that used to look for the absence of a skip notice.
            OA_TEST_REQUIRE_INFRA: '1'
            # JR-6-02b: `journal-inbound.worker.ts` now imports the real Phase-B processor, which
            # imports `IngestionService`/`StorageService` at module scope -- and `config/storage.ts`
            # throws **at import**, not at first use, if `STORAGE_TYPE` is unset. Before this slice
            # the comment here correctly said the integration suite never touched `config/storage.ts`
            # at all; that stopped being true the moment the worker's own module graph reached it.
            # `STORAGE_LOCAL_ROOT_PATH` only needs to exist as a path -- `journal-inbound-worker.int.test.ts`
            # fails its one job at the gate (no ledger receipt), before any file is ever written. A
            # plain literal, not a `${{ runner.temp }}` expression: this is job-level `env:`, and the
            # existing use of that expression in this file is step-level -- kept simple rather than
            # relying on an untested combination.
            STORAGE_TYPE: local
            STORAGE_LOCAL_ROOT_PATH: /tmp/oa-storage
            # `CryptoService` throws at import without this (`decryptSource()`/`seedIngestionSource()`
            # now always populate `credentials`, JR-6-02b's F-caught gap in the shared seed helper).
            # A fixed test-only value, never a secret.
            ENCRYPTION_KEY: ci-test-only-encryption-key-not-a-secret
            # ADR-035: same variables `packages/backend/src/config/search.ts` reads, pointed at the
            # `meilisearch` service above. Unlike `valkey`, the key here is real and checked -- see
            # that service's own comment.
            MEILI_HOST: http://localhost:7700
            MEILI_MASTER_KEY: ci-test-only-meili-master-key-not-a-secret

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: 10.13.1

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Check only -- `prettier --check`. Never `pnpm format`.
            - name: Lint
              run: pnpm lint

            # Prerequisite, not scope creep. `@open-archiver/types` resolves through
            # `main: dist/index.js` / `types: dist/index.d.ts`, and `dist` is gitignored, so on a
            # fresh checkout nothing downstream can resolve it: the backend build, the frontend
            # `check` and `test:types` all fail with 54x TS2307 until this has run. `pnpm --filter
            # @open-archiver/backend build` does *not* pull it in -- only the repo's own
            # `build:oss` (which filters `./packages/*` and lets pnpm order topologically) does.
            # Kept as its own step rather than folded into the filter, so the log says which
            # package failed.
            - name: Build shared types
              run: pnpm --filter @open-archiver/types build

            # Same mechanism as the step above, one package later (JR-2-06). Since `packages/backend`
            # depends on `@open-archiver/journaling`, its `dist` has to exist before `test:types` runs
            # -- otherwise `tests/support/postgres-transactor.ts` and the writer integration test fail
            # with TS2307, exactly the way the types package did. This bit once already: the JR-2-06 CI
            # run was red here while the local run was green, because a local `dist` was lying around.
            - name: Build journaling
              run: pnpm --filter @open-archiver/journaling build

            # F47 (docs/dev/journaling/06-status.md, JR-4-06b): this step did not exist before, and
            # `@open-archiver/journaling` is the package with the most new code in E4 -- a type error in
            # its own `tests/` tree (`smtp-acceptance-wiring.test.ts`, `JR-4-06a`) went unnoticed for a
            # whole slice because only the backend's test files were ever typechecked here. Placed right
            # after "Build journaling", the same pairing "Build shared types" already has with nothing
            # after it needing to typecheck against it (`@open-archiver/types` build only) -- journaling's
            # `tsconfig.test.json` needs `@open-archiver/types`'s `dist` (built above) and nothing from
            # `packages/backend`, so this does not have to wait for that build to run.
            - name: Typecheck journaling test files
              run: pnpm --filter @open-archiver/journaling test:types

            - name: Build backend
              run: pnpm --filter @open-archiver/backend build

            - name: Check frontend
              run: pnpm --filter @open-archiver/frontend check

            - name: Typecheck backend test files
              run: pnpm --filter @open-archiver/backend test:types

            - name: Test
              id: test
              shell: bash
              env:
                  # vitest's globalSetup writes the suite inventory here (JR-1-05b). Under RUNNER_TEMP
                  # like the log: this workflow writes nothing into the checkout.
                  OA_TEST_INVENTORY_REPORT: ${{ runner.temp }}/suite-inventory.json
                  # And the executed-test measurement plus its verdict here (JR-1-05c). Same reason
                  # for the location; without the override it lands under node_modules/.cache.
                  OA_TEST_EXECUTED_REPORT: ${{ runner.temp }}/executed-tests.json
              run: |
                  set -o pipefail
                  # The log goes to RUNNER_TEMP, not the workspace: this workflow writes nothing
                  # into the checkout.
                  pnpm test 2>&1 | tee "$RUNNER_TEMP/test-output.log"

            # A suite that does not exist is green, and so is a `*.test.ts` file under
            # `tests/integration/` that matches no project glob -- both were found during the JR-1-06
            # acceptance, and both were invisible to the log grep this step used to be.
            #
            # The replacement is a positive expectation: the run has to have produced an inventory
            # report in which every suite matched exactly its declared number of files and no
            # test-looking file was left uncollected. A missing report fails the step, so removing
            # the `globalSetup` entry from `vitest.config.ts` cannot silently disable the guard
            # either. The counts live in `tests/support/suite-inventory.ts` only.
            #
            # JR-1-05c adds the second report. Counting files cannot see coverage that disappears
            # without the filesystem changing -- a suite relabelled from `ci` to `nightly`, a file
            # whose tests are all `it.skip`, a deletion absorbed by an addition (F14, F15) -- so the
            # run also has to have produced an executed-test measurement whose verdict is
            # `applicable` and violation-free. Applicability matters: a run narrowed with `-t`, a file
            # filter, `--project` or `--shard` verifies nothing, and this job must not be one.
            #
            # The "suite was skipped" case is covered separately and earlier, by
            # `OA_TEST_REQUIRE_INFRA` in this job's `env`: an unreachable Postgres now fails the test
            # step itself.
            - name: Assert the expected suites actually existed and ran
              if: always() && steps.test.conclusion != 'skipped'
              shell: bash
              run: |
                  node tests/support/assert-inventory-report.mjs \
                      "$RUNNER_TEMP/suite-inventory.json" \
                      "$RUNNER_TEMP/executed-tests.json"

            # `release()` drops the per-run database, and `sweepStaleHarnessDatabases()` cleans up
            # after a killed worker. A leftover here is a harness defect and must fail the job
            # rather than accumulate silently. `OA_TEST_PG_STALE_MS` is deliberately left at its
            # default -- lowering it lets the sweeper delete a *foreign* running job's database
            # (F12). Since JR-1-04a the harness refuses a lowered threshold that is not paired with an
            # explicit list of names, so this is enforced there too, not only by this comment.
            #
            # Since JR-1-05c the globalSetup teardown drops this run's residue itself, and in an
            # unnarrowed run it also fails the run for having produced any (F16, F24). That does not
            # make this step redundant: the teardown only knows what the ledger recorded, so a
            # database created between `CREATE DATABASE` and the ledger write, or by something that
            # bypassed the harness, is still only visible here.
            - name: Assert no leftover test databases
              if: always() && steps.test.conclusion != 'skipped'
              shell: bash
              run: |
                  leftovers=$(psql -h localhost -p 5432 -U postgres -d postgres -At \
                      -c "select datname from pg_database where datname like 'oa\_test\_%'")
                  if [ -n "$leftovers" ]; then
                      echo "::error::Test databases were left behind after the run:"
                      echo "$leftovers"
                      exit 1
                  fi
                  echo "No oa_test_* databases left behind."
